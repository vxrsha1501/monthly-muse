[project]
name = "monthlymuse-backend"
version = "0.1.0"
description = "MonthlyMuse - AI-Powered Automated Message Generator for Monthly Posting (backend)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "email-validator>=2.0",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
embeddings = ["sentence-transformers>=2.6"]
nlp = ["spacy>=3.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
